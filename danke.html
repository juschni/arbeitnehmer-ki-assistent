<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Danke – CareerAI</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 50%, #2d1b4e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      line-height: 1.6;
    }
    .card {
      background: rgba(30,30,60,0.7);
      border: 1px solid rgba(167,139,250,0.25);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      text-align: center;
    }
    .icon { font-size: 3rem; margin-bottom: 20px; }
    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 16px;
    }
    p { color: #cbd5e1; margin-bottom: 12px; }
    .highlight {
      background: rgba(124,58,237,0.15);
      border: 1px solid rgba(124,58,237,0.3);
      border-radius: 12px;
      padding: 16px;
      margin: 24px 0;
      color: #e2e8f0;
    }
    a {
      color: #a78bfa;
      text-decoration: none;
    }
    a:hover { text-decoration: underline; }
    .btn {
      display: inline-block;
      margin-top: 24px;
      background: linear-gradient(135deg, #7c3aed, #ec4899);
      color: #fff;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 10px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">✅</div>
    <h1>Zahlung erfolgreich</h1>
    <p>Vielen Dank für deinen Kauf des <strong>Karriere-Boosts</strong>.</p>
    
    <div class="highlight">
      Du erhältst in Kürze eine E-Mail mit deinem persönlichen Zugangscode und dem Link zur Premium-Version.
    </div>

    <p>Bitte prüfe auch deinen Spam-Ordner.</p>
    <p style="font-size: 0.9rem; color: #94a3b8; margin-top: 24px;">
      Bei Fragen einfach antworten – wir helfen gerne.
    </p>

    <a class="btn" href="index.html">Zurück zur Startseite</a>
  </div>
</body>
</html>
